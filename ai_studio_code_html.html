<div id="code-container">
     <style>
              #scano-chat-widget {
                width: 100%;
                height: 100%;
                max-width: 820px;
              }
              #scano-chat-widget iframe {
                width: 100%;
                height: 100%;
                border: none;
                border-radius: 22px;
                display: block;
                background: white;
                pointer-events: auto;
                touch-action: auto;
                box-shadow:
                  0 0 0 1px rgba(167, 139, 250, 0.15),
                  0 24px 80px rgba(0, 0, 0, 0.6),
                  0 0 60px rgba(109, 40, 217, 0.15);
              }

              @media (max-width: 767px) {
                #scano-chat-widget {
                  height: 80vh;
                }
                #scano-chat-widget iframe {
                  border-radius: 16px;
                }
              }
            </style>
            <div id="scano-chat-widget" style="height: 75vh"></div>

            <script>
              (function () {
                const container = document.getElementById(
                  "scano-embed-container",
                );

                const copilotKey = "ck_fa0c7803-da07-47b8-a6f2-95640f6a0eac";
                const baseUrl = "https://test-mlservice.dentaldost.co";
                const iframeUrl = "https://test-copilot.dentaldost.co";
                let iframeLoaded = false;
                const clamp = (v, min, max) => Math.min(Math.max(v, min), max);
                const norm = (v, min, max) =>
                  clamp((v - min) / (max - min), 0, 1);
                const ease = (t) =>
                  t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
                async function loadWidget() {
                  if (iframeLoaded) return;
                  iframeLoaded = true;
                  const container =
                    document.getElementById("scano-chat-widget");
                  async function getCustomConfig() {
                    try {
                      const res = await fetch(`${baseUrl}/copilot/v1/config`, {
                        headers: {
                          "x-copilot-key": copilotKey,
                        },
                      });
                      if (!res.ok) return {};
                      const body = await res.json();
                      return body.config || {};
                    } catch {
                      return {};
                    }
                  }
                  async function getCountryCode() {
                    try {
                      const res = await fetch("https://ipapi.co/json/");
                      const data = await res.json();
                      return data.country_calling_code;
                    } catch {
                      return "+91";
                    }
                  }
                  const customConfig = await getCustomConfig();
                  const iframe = document.createElement("iframe");
                  iframe.src = iframeUrl;
                  iframe.allow =
                    "microphone; camera; display-capture; autoplay; clipboard-write";
                  container.appendChild(iframe);
                  iframe.onload = async () => {
                    const countryCode = await getCountryCode();
                    iframe.contentWindow.postMessage(
                      {
                        type: "SCANO_INIT",
                        payload: {
                          "copilot-key": copilotKey,
                          website: window.location.origin,
                          customConfig,
                          countryCode,
                        },
                      },
                      "*",
                    );
                  };
                }

                window.addEventListener("message", (event) => {
                  const data = event.data;
                  if (data?.type === "SCANO_RESIZE") {
                    document.documentElement.style.setProperty(
                      "--scano-chat-height",
                      `${data.height}px`,
                    );
                  }
                });
                /* preload iframe */
                if ("requestIdleCallback" in window) {
                  requestIdleCallback(() => {
                    loadWidget();
                  });
                } else {
                  setTimeout(() => {
                    loadWidget();
                  }, 1200);
                }
              })();
            </script>
</div>
